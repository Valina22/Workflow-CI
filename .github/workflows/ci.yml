name: ML CI - Train, Package & Deploy

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'MLProject/**'
      - 'Dockerfile'
      - '.github/workflows/ci.yml'

  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/heart-disease-ml

jobs:

  lint-test:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Lint Tools
        run: pip install flake8

      - name: Run Flake8
        run: |
          flake8 MLProject/modelling.py \
            --max-line-length=110 \
            --ignore=E501,W503,E302
        continue-on-error: true

      - name: Check Python Syntax
        run: |
          python -m py_compile MLProject/modelling.py
          echo "Syntax check passed"

  train:
    name: Train Model with MLflow
    runs-on: ubuntu-latest
    needs: lint-test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow
          pip install -r MLProject/requirements.txt

      - name: Train Model
        run: |
         cd MLProject
         python modelling.py

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ml-artifacts-${{ github.run_number }}
          path: |
            MLProject/artifacts/
            MLProject/models/
          if-no-files-found: warn

  docker-build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: train
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mlflow
        pip install -r MLProject/requirements.txt

    - name: Train Model
      run: |
        cd MLProject
        python modelling.py

    - name: Login Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build Docker with MLflow
      run: |
        mlflow models build-docker \
          -m MLProject/models/best_model \
          -n heart-disease-mlflow

    - name: Tag Image
      run: |
        docker tag heart-disease-mlflow \
          ${{ env.DOCKER_IMAGE }}:latest

    - name: Push Docker Image
      run: |
        docker push ${{ env.DOCKER_IMAGE }}:latest

  notify:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [lint-test, train, docker-build-push]
    if: always()

    steps:
      - name: Print Summary
        run: |
          echo "===================================="
          echo "ML CI PIPELINE COMPLETE"
          echo "===================================="
          echo "Lint   : ${{ needs.lint-test.result }}"
          echo "Train  : ${{ needs.train.result }}"
          echo "Docker : ${{ needs.docker-build-push.result }}"
          echo "Run    : #${{ github.run_number }}"
          echo "Actor  : ${{ github.actor }}"
          echo "Branch : ${{ github.ref_name }}"